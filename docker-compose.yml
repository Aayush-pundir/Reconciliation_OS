# Recon OS - full stack. `docker compose up --build` gives you:
#   frontend  -> http://localhost:5173
#   backend   -> http://localhost:8000  (docs at /docs)
# Default seeded login: admin@eroute.local / ChangeMe123!  (change in prod)
#
# Scaling: `docker compose up --scale worker=4` adds worker capacity for
# large batches (e.g. UPI's 500-file NTSL uploads) without touching the API
# tier - see ARCHITECTURE.md §Deployment Topology.

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: recon
      POSTGRES_PASSWORD: recon
      POSTGRES_DB: recon_os
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U recon"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build: ./backend
    environment:
      DATABASE_URL: postgresql+psycopg2://recon:recon@postgres:5432/recon_os
      JWT_SECRET: change-me-in-production
      JOB_RUNNER: celery
      CELERY_BROKER_URL: redis://redis:6379/0
      CELERY_RESULT_BACKEND: redis://redis:6379/1
      STORAGE_BACKEND: local
      STORAGE_LOCAL_ROOT: /data/storage
      CORS_ORIGINS: '["http://localhost:5173"]'
      SEED_ADMIN_EMAIL: admin@eroute.local
      SEED_ADMIN_PASSWORD: ChangeMe123!
    volumes:
      - storage:/data/storage
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    command: sh -c "alembic upgrade head && uvicorn app.main:app --host 0.0.0.0 --port 8000"

  worker:
    build: ./backend
    environment:
      DATABASE_URL: postgresql+psycopg2://recon:recon@postgres:5432/recon_os
      JOB_RUNNER: celery
      CELERY_BROKER_URL: redis://redis:6379/0
      CELERY_RESULT_BACKEND: redis://redis:6379/1
      STORAGE_BACKEND: local
      STORAGE_LOCAL_ROOT: /data/storage
    volumes:
      - storage:/data/storage
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    command: celery -A app.workers.celery_app worker --loglevel=info --concurrency=4

  frontend:
    build: ./frontend
    ports:
      - "5173:80"
    depends_on:
      - backend

volumes:
  pgdata:
  storage:
